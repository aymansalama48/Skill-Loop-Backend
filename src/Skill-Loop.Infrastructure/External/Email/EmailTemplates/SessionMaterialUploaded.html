<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <title>تم رفع مادة جديدة</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #2c3e50;">📚 تم رفع مادة جديدة لحصة: {{SessionTitle}}</h2>
    <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0;">
        <p><strong>اسم المادة:</strong> {{MaterialName}}</p>
        <p><strong>نوع المادة:</strong> {{MaterialType}}</p>
        <p><strong>تاريخ الرفع:</strong> {{UploadedAt}}</p>
        <p><strong>المحمل بواسطة:</strong> {{InstructorName}}</p>
    </div>
    <a href="{{DownloadUrl}}" style="display: inline-block; background: #3498db; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; margin: 10px 0;">تنزيل المادة</a>
    <p style="color: #888; margin-top: 30px;">هذا إشعار تلقائي من نظام Skill Loop.</p>
</body>
</html>
