<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلغاء الحجز</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #d9534f; margin-bottom: 20px; }
        p { font-size: 16px; line-height: 1.6; }
        .details { background-color: #f9f9f9; padding: 20px; border-radius: 6px; margin: 20px 0; border: 1px solid #eee; }
        .btn { display: inline-block; padding: 12px 24px; background-color: #007bff; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .footer { margin-top: 30px; font-size: 14px; color: #777; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>إلغاء حجز الجلسة</h1>
        <p>مرحباً <strong>{{LearnerName}}</strong>،</p>
        <p>نأسف لإبلاغك بأنه تم إلغاء حجز جلستك.</p>
        
        <div class="details">
            <p><strong>سبب الإلغاء:</strong> {{Reason}}</p>
        </div>
        
        <p>يمكنك مراجعة تفاصيل الحجز ومحفظتك من خلال لوحة التحكم الخاصة بك.</p>
        <center>
            <a href="{{DashboardUrl}}" class="btn">الانتقال للوحة التحكم</a>
        </center>
        
        <div class="footer">
            <p>&copy; {{Year}} Skill Loop. جميع الحقوق محفوظة.</p>
        </div>
    </div>
</body>
</html>
