<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <title>تنبيه تخزين</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, sans-serif; direction: rtl; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2 style="color: #e74c3c;">⚠️ تنبيه: اقتراب حدود تخزين Google Drive</h2>
    <div style="background: #fff3cd; padding: 20px; border-radius: 8px; margin: 20px 0; border: 2px solid #ffc107;">
        <p><strong>المستخدم:</strong> {{UserName}}</p>
        <p><strong>المستخدم:</strong> {{UsedFormatted}} من {{TotalFormatted}}</p>
        <p><strong>عتبر التحذير:</strong> {{Threshold:P0}}</p>
    </div>
    <p style="color: #888; margin-top: 30px;">هذا إشعار تلقائي من نظام Skill Loop.</p>
</body>
</html>
